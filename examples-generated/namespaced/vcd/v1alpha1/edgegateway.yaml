apiVersion: vcd.m.upbound.io/v1alpha1
kind: Edgegateway
metadata:
  annotations:
    meta.upbound.io/example-id: vcd/v1alpha1/edgegateway
  labels:
    testing.upbound.io/example-name: egw
  name: egw
  namespace: crossplane-system
spec:
  forProvider:
    configuration: compact
    description: new edge gateway
    externalNetwork:
    - name: my-ext-net1
      subnet:
      - gateway: 192.168.30.49
        ipAddress: 192.168.30.51
        netmask: 255.255.255.240
        useForDefaultRoute: true
    name: my-egw
    org: my-org
    vdc: my-vdc

---

apiVersion: vcd.m.upbound.io/v1alpha1
kind: NetworkRouted
metadata:
  annotations:
    meta.upbound.io/example-id: vcd/v1alpha1/edgegateway
  labels:
    testing.upbound.io/example-name: rnet1
  name: rnet1
  namespace: crossplane-system
spec:
  forProvider:
    edgeGateway: my-egw
    gateway: 192.168.2.1
    name: rnet1
    org: my-org
    staticIpPool:
    - endAddress: 192.168.2.100
      startAddress: 192.168.2.2
    vdc: my-vdc
